name: CI y despliegue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Por defecto sólo lectura; el job de despliegue pide lo que necesita.
permissions:
  contents: read

# Un run por rama/PR: un push nuevo cancela el anterior de la misma rama, pero un PR nunca cancela main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Tipos, tests, docs y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo: fechas «Actualizado» de la documentación
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Comprobación de tipos
        run: npm run typecheck
      - name: Tests unitarios (motor CPU, geometría, configuración, URL)
        run: npm test
      - name: Documentación generada al día (parámetros, presets, JSON Schema)
        run: npm run docs:gen -- --check
      - name: Estilo de Markdown
        run: npm run lint:md
      - name: Build de la app
        run: npm run build
      - name: Build de un solo archivo
        run: node scripts/build-single.mjs
      - name: Build de la documentación (falla con enlaces rotos)
        run: npm run docs:build
      - name: Anclas y enlaces relativos
        run: npm run docs:links
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
